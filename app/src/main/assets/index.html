<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#123b35"><title>Meal Manager</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#172b27;--muted:#71817c;--green:#176b57;--line:#e3ebe7;--red:#b33c3c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{background:#123b35;color:white;padding:20px 18px 15px;position:sticky;top:0;z-index:5}header h1{font-size:21px;margin:0 0 4px}header small{opacity:.8}.monthbar{display:flex;align-items:center;gap:10px;margin-top:14px}.monthbar input{background:#fff;color:#172b27;border:0;border-radius:10px;padding:9px;flex:1}nav{display:flex;overflow:auto;background:white;border-bottom:1px solid var(--line);position:sticky;top:107px;z-index:4}nav button{border:0;background:none;padding:13px 15px;color:var(--muted);white-space:nowrap;font-weight:650}nav button.active{color:var(--green);border-bottom:3px solid var(--green)}main{padding:15px;max-width:760px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:23px;margin-top:5px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 10px}.sectionhead h2{font-size:17px;margin:0}.btn{border:0;background:var(--green);color:white;padding:10px 14px;border-radius:10px;font-weight:650}.btn.secondary{background:#e8f1ed;color:var(--green)}.btn.danger{background:#faeaea;color:var(--red)}.btn.small{padding:7px 10px;font-size:13px}.muted{color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row .sub{font-size:12px;color:var(--muted);margin-top:3px}.amount{font-weight:700;text-align:right}.pill{font-size:12px;border-radius:30px;padding:4px 8px;background:#e8f1ed;color:var(--green)}input,select{width:100%;padding:11px;border:1px solid #d7e2dc;border-radius:10px;background:white;color:var(--ink);font:inherit;margin:5px 0 11px}label{font-size:13px;font-weight:650;color:#53645e}form{padding-top:5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.empty{text-align:center;color:var(--muted);padding:25px 8px}.hint{font-size:12px;color:var(--muted);line-height:1.5}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:9px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted)}.mealinput{width:64px;margin:0;padding:7px;text-align:center}.hidden{display:none!important}.syncbox{word-break:break-word;background:#f7faf8;padding:10px;border-radius:9px;font-size:12px}.status{font-size:13px;margin-top:8px}.good{color:var(--green)}.bad{color:var(--red)}
</style></head><body>
<header><h1>🍽️ Meal Manager</h1><small>Offline-first • Monthly accounts</small><div class="monthbar"><label style="color:white">Month</label><input id="month" type="month"></div></header>
<nav id="nav"><button data-tab="home" class="active">Overview</button><button data-tab="members">Members</button><button data-tab="meals">Meals</button><button data-tab="bazar">Bazar</button><button data-tab="reports">Reports</button><button data-tab="sync">Sync</button><button data-tab="about">About</button></nav>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s), money=n=>'৳ '+(Number(n)||0).toLocaleString('en-BD',{maximumFractionDigits:2}), today=()=>new Date().toISOString().slice(0,10), monthNow=()=>today().slice(0,7), uid=()=>Math.random().toString(36).slice(2,10);
let state=JSON.parse(localStorage.getItem('mealManagerData')||'null')||{members:[],months:{},settings:{endpoint:'',token:''}};let tab='home';
function save(){localStorage.setItem('mealManagerData',JSON.stringify(state))}function key(){return $('#month').value||monthNow()}function data(){let k=key();if(!state.months[k])state.months[k]={deposits:[],meals:[],bazar:[]};return state.months[k]}
function calc(){let d=data(), totalExpense=d.bazar.reduce((s,x)=>s+Number(x.amount||0),0),totalMeals=d.meals.reduce((s,x)=>s+Number(x.count||0),0),rate=totalMeals?totalExpense/totalMeals:0;let rows=state.members.map(m=>{let meals=d.meals.filter(x=>x.memberId===m.id).reduce((s,x)=>s+Number(x.count||0),0),deposit=d.deposits.filter(x=>x.memberId===m.id).reduce((s,x)=>s+Number(x.amount||0),0),cost=meals*rate;return {...m,meals,deposit,cost,balance:deposit-cost}});return {d,totalExpense,totalMeals,rate,rows,totalDeposit:rows.reduce((s,x)=>s+x.deposit,0)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let c=calc(),html='';
if(tab==='home'){html=`<div class="grid"><div class="card metric"><small>Net deposits / adjustments</small><strong>${money(c.totalDeposit)}</strong></div><div class="card metric"><small>Bazar expenses</small><strong>${money(c.totalExpense)}</strong></div><div class="card metric"><small>Total meal units</small><strong>${c.totalMeals}</strong></div><div class="card metric"><small>Meal rate</small><strong>${money(c.rate)}</strong></div></div><div class="sectionhead"><h2>Member balances</h2><span class="pill">${c.rows.length} members</span></div><div class="card">${c.rows.length?c.rows.map(m=>`<div class="row"><div><b>${esc(m.name)}</b><div class="sub">${m.meals} meals · Deposited ${money(m.deposit)}</div></div><div class="amount">${money(m.balance)}<div class="sub">${m.balance<0?'Due':'Remaining'}</div></div></div>`).join(''):'<div class="empty">Add members to start your monthly account.</div>'}</div><p class="hint">Meal rate = total bazar expenses ÷ total meal units. Individual meal cost = member meal units × meal rate. Remaining balance = deposits − individual meal cost.</p>`}
if(tab==='members'){html=`<div class="sectionhead"><h2>Members</h2><span class="pill">${state.members.length} total</span></div><div class="card"><form id="memberForm"><label>Member name</label><input name="name" required placeholder="Enter member name"><button class="btn">+ Add member</button></form></div><div class="card"><div class="sectionhead" style="margin-top:0"><h2>Record deposit</h2></div><form id="depositForm"><label>Member</label><select name="memberId" required>${state.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><div class="formgrid"><div><label>Date</label><input name="date" type="date" value="${today().slice(0,7)===key()?today():key()+'-01'}" required></div><div><label>Amount (৳)</label><input name="amount" type="number" step="0.01" required placeholder="e.g. 1000 or -500"></div></div><p class="hint">Enter a positive amount for cash received. Enter a negative amount for a previous-month due (e.g. -500).</p><button class="btn" ${!state.members.length?'disabled':''}>+ Add deposit</button></form></div><div class="card"><b>Members</b>${state.members.length?state.members.map((m,i)=>`<div class="row"><div><b>${i+1}. ${esc(m.name)}</b></div><button class="btn danger small" onclick="removeMember('${m.id}')">Remove</button></div>`).join(''):'<div class="empty">No members added yet.</div>'}</div><div class="card"><b>Deposits this month</b>${c.d.deposits.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="row"><div><b>${esc(state.members.find(m=>m.id===x.memberId)?.name||'Removed member')}</b><div class="sub">${x.date}</div></div><div class="amount">${money(x.amount)} <button class="btn danger small" onclick="removeEntry('deposits','${x.id}')">×</button></div></div>`).join('')||'<div class="empty">No deposits recorded for this month.</div>'}</div>`}
if(tab==='meals'){let days=new Date(Number(key().slice(0,4)),Number(key().slice(5,7)),0).getDate();html=`<div class="sectionhead"><h2>Daily meal entry</h2><span class="pill">${key()}</span></div><div class="card"><form id="mealForm"><label>Date</label><input name="date" type="date" value="${key()}-01" min="${key()}-01" max="${key()}-${String(days).padStart(2,'0')}" required><label>Member</label><select name="memberId" required>${state.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><label>Meal units (e.g. 1, 0.5)</label><input name="count" type="number" min="0" step="0.5" value="1" required><button class="btn" ${!state.members.length?'disabled':''}>Save meal</button></form></div><div class="card"><div class="sectionhead" style="margin-top:0"><h2>Meal entries</h2></div>${c.d.meals.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>{let m=state.members.find(z=>z.id===x.memberId);return `<div class="row"><div><b>${esc(m?.name||'Removed member')}</b><div class="sub">${x.date}</div></div><div class="amount">${x.count} <button class="btn danger small" onclick="removeEntry('meals','${x.id}')">×</button></div></div>`}).join('')||'<div class="empty">No meal entries for this month.</div>'}</div>`}
if(tab==='bazar'){html=`<div class="sectionhead"><h2>Bazar expenses</h2><span class="pill">${money(c.totalExpense)}</span></div><div class="card"><form id="bazarForm"><div class="formgrid"><div><label>Date</label><input name="date" type="date" value="${today().slice(0,7)===key()?today():key()+'-01'}" required></div><div><label>Amount (৳)</label><input name="amount" type="number" min="0.01" step="0.01" required placeholder="0"></div></div><label>Buyer / name</label><input name="name" required placeholder="Who paid?"><label>Note (optional)</label><input name="note" placeholder="Rice, vegetables, etc."><button class="btn">+ Add expense</button></form></div><div class="card">${c.d.bazar.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="row"><div><b>${esc(x.name)}</b><div class="sub">${x.date} · ${esc(x.note||'Bazar')}</div></div><div class="amount">${money(x.amount)} <button class="btn danger small" onclick="removeEntry('bazar','${x.id}')">×</button></div></div>`).join('')||'<div class="empty">No expenses entered this month.</div>'}</div>`}
if(tab==='reports'){html=`<div class="sectionhead"><h2>Monthly report</h2><span class="pill">${key()}</span></div><div class="grid"><div class="card metric"><small>Meal rate</small><strong>${money(c.rate)}</strong></div><div class="card metric"><small>Unallocated expense</small><strong>${money(c.totalMeals?0:c.totalExpense)}</strong></div></div><div class="card"><div class="tablewrap"><table><thead><tr><th>Member</th><th>Meals</th><th>Net deposit</th><th>Meal cost</th><th>Balance</th></tr></thead><tbody>${c.rows.map(m=>`<tr><td>${esc(m.name)}</td><td>${m.meals}</td><td>${money(m.deposit)}</td><td>${money(m.cost)}</td><td>${money(m.balance)}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><b>Monthly totals</b><div class="row"><span>Total meal units</span><b>${c.totalMeals}</b></div><div class="row"><span>Total deposits</span><b>${money(c.totalDeposit)}</b></div><div class="row"><span>Total bazar expenses</span><b>${money(c.totalExpense)}</b></div><div class="row"><span>Meal rate</span><b>${money(c.rate)}</b></div><button class="btn secondary" onclick="exportCSV()">Export report CSV</button></div>`}
if(tab==='about'){html=`<div class="card" style="text-align:center;padding:24px 18px"><div style="width:92px;height:92px;margin:0 auto 12px;border-radius:24px;background:linear-gradient(145deg,#087a3d,#07552f);display:grid;place-items:center;color:white;font-size:48px;box-shadow:0 6px 18px #07552f33">🍽️</div><h2 style="font-size:24px;margin:0;color:#176b57">Meal Manager</h2><p class="muted" style="margin:6px 0 0">Manage your meal expenses with ease!</p></div><div class="card"><h3 style="margin:0 0 10px;color:#176b57">About this app</h3><p style="line-height:1.65;margin:0">Meal Manager helps you manage shared household, family or hostel meal expenses. Track members, deposits, daily meals, bazar expenses, meal rates and monthly reports — all in one place.</p><div class="row"><span>✓ Offline data storage</span><span class="pill">Available</span></div><div class="row"><span>✓ Google Sheets synchronization</span><span class="pill">Supported</span></div></div><div class="card"><div style="display:flex;align-items:center;gap:13px"><img src="profile-shibly.jpg" alt="Shibly" style="width:76px;height:76px;object-fit:cover;object-position:center 28%;border-radius:50%;border:3px solid #dceee5;box-shadow:0 2px 8px #123b3522"><div><div class="muted">Developed by</div><strong style="font-size:19px">Shibly</strong><div class="hint">Meal Manager developer</div></div></div><a href="https://www.facebook.com/shibly6" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:12px;margin-top:18px;padding:12px;background:#eef5ff;border-radius:12px;color:#0866ff;text-decoration:none;font-weight:650"><span style="font-size:25px">ⓕ</span><span>Find me on Facebook<br><small style="font-weight:400">facebook.com/shibly6</small></span><span style="margin-left:auto">↗</span></a></div><div class="card" style="text-align:center"><div class="muted">App version</div><strong>1.0.0</strong><p class="hint" style="margin-bottom:0">Thank you for using Meal Manager!</p></div>`}
if(tab==='sync'){html=`<div class="sectionhead"><h2>Google Sheets sync</h2><span class="pill">Offline-first</span></div><div class="card"><label>Apps Script Web App URL</label><input id="endpoint" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(state.settings.endpoint)}"><label>Access token</label><input id="syncToken" type="password" placeholder="Same secret as APP_TOKEN in Apps Script" value="${esc(state.settings.token)}"><button class="btn secondary" onclick="saveEndpoint()">Save settings</button><p class="hint">Your entries remain on this phone when offline. Deploy the included Google Apps Script to your spreadsheet, paste its Web App URL here, then use Sync to upload or download data.</p><div class="syncbox">Spreadsheet ID: 1-5X3oN-BW_MQLFROe5WgakP3AoLvBbnn0NeRzpsnL2Y</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="syncNow('push')">Upload to Sheets</button><button class="btn secondary" onclick="syncNow('pull')">Download from Sheets</button></div><div id="syncStatus" class="status"></div></div><div class="card"><b>Local backup</b><p class="hint">Export a JSON backup before changing phones. Restore it later on this device.</p><button class="btn secondary" onclick="backup()">Export backup</button><label style="display:block;margin-top:15px">Restore backup</label><input id="restoreFile" type="file" accept="application/json"><button class="btn secondary" onclick="restore()">Restore JSON</button></div>`}
$('#app').innerHTML=html;
if(tab==='members')$('#memberForm')?.addEventListener('submit',e=>{e.preventDefault();let name=new FormData(e.target).get('name').trim();if(name){state.members.push({id:uid(),name});save();show()}});
if(tab==='members')$('#depositForm')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);data().deposits.push({id:uid(),memberId:f.get('memberId'),date:f.get('date'),amount:Number(f.get('amount'))});save();show()});
if(tab==='meals')$('#mealForm')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),d=data();let date=f.get('date');let old=d.meals.find(x=>x.memberId===f.get('memberId')&&x.date===date);if(old)old.count=Number(old.count)+Number(f.get('count'));else d.meals.push({id:uid(),memberId:f.get('memberId'),date,count:Number(f.get('count'))});save();show()});
if(tab==='bazar')$('#bazarForm')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);data().bazar.push({id:uid(),date:f.get('date'),name:f.get('name'),amount:Number(f.get('amount')),note:f.get('note')});save();show()});
}
function removeMember(id){if(!confirm('Remove this member? Existing historical entries are retained.'))return;state.members=state.members.filter(m=>m.id!==id);save();show()}
function removeEntry(type,id){let d=data();d[type]=d[type].filter(x=>x.id!==id);save();show()}
function saveEndpoint(){state.settings.endpoint=$('#endpoint').value.trim();state.settings.token=$('#syncToken').value.trim();save();$('#syncStatus').textContent='Sync settings saved on this phone.'}
function syncNow(mode){let el=$('#syncStatus'),url=state.settings.endpoint;if(!url){el.className='status bad';el.textContent='Enter and save your Apps Script URL first.';return}try{let response,token=state.settings.token;if(!token)throw Error('Enter the access token configured in Apps Script.');if(mode==='push'){response=MealBridge.request('POST',url,JSON.stringify({action:'save',token,data:state}));}else{response=MealBridge.request('GET',url+'?action=load&token='+encodeURIComponent(token),'');}let result=JSON.parse(response);if(result.error||result.ok===false)throw Error(result.error||result.message||'Sync failed');if(mode==='pull'){if(!result.data)throw Error('No saved data returned');state=result.data;save();show();}el=$('#syncStatus');el.className='status good';el.textContent=mode==='push'?'Upload complete. Google Sheets has the latest app data.':'Download complete. Local data has been replaced with the sheet backup.'}catch(e){el=$('#syncStatus');el.className='status bad';el.textContent='Sync failed: '+e.message}}
function exportCSV(){let c=calc(),lines=[['Member','Meals','Net deposit / adjustment (BDT)','Meal cost (BDT)','Remaining balance (BDT)'],...c.rows.map(m=>[m.name,m.meals,m.deposit,m.cost,m.balance])];let csv=lines.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');download(csv,'meal-report-'+key()+'.csv','text/csv')}
function backup(){let json=JSON.stringify(state,null,2);if(window.MealBridge&&MealBridge.exportBackup){MealBridge.exportBackup(json)}else{download(json,'meal-manager-backup.json','application/json')}}
function download(content,name,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function restore(){if(window.MealBridge&&MealBridge.pickBackup){MealBridge.pickBackup();return}let f=$('#restoreFile').files[0];if(!f)return alert('Choose a JSON backup first.');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.members||!x.months)throw Error('Invalid backup');state=x;save();show();alert('Backup restored.')}catch(e){alert('Could not restore: '+e.message)}};r.readAsText(f)}
window.restoreFromNative=function(raw){try{let x=JSON.parse(raw);if(!x.members||!x.months)throw Error('Invalid backup');state=x;save();show();alert('Backup restored successfully.')}catch(e){alert('Could not restore: '+e.message)}}
$('#month').value=monthNow();$('#month').addEventListener('change',show);$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-tab]');if(b){tab=b.dataset.tab;show()}});show();
</script></body></html>

</style></head><body>
<header><h1>🍽️ Meal Manager</h1><small>Offline-first • Monthly accounts</small><div class="monthbar"><label style="color:white">Month</label><input id="month" type="month"></div></header>
<nav id="nav"><button data-tab="home" class="active">Overview</button><button data-tab="members">Members</button><button data-tab="meals">Meals</button><button data-tab="bazar">Bazar</button><button data-tab="reports">Reports</button><button data-tab="sync">Sync</button><button data-tab="about">About</button></nav>
<main id="app"></main>
<script>
const APP_VERSION='1.4.0';
const $=s=>document.querySelector(s), money=n=>'৳ '+(Number(n)||0).toLocaleString('en-BD',{maximumFractionDigits:2}), today=()=>new Date().toISOString().slice(0,10), monthNow=()=>today().slice(0,7), uid=()=>Math.random().toString(36).slice(2,10);
let state=JSON.parse(localStorage.getItem('mealManagerData')||'null')||{members:[],months:{},settings:{endpoint:'',token:''}};let tab='home';
function save(){localStorage.setItem('mealManagerData',JSON.stringify(state))}function key(){return $('#month').value||monthNow()}function data(){let k=key();if(!state.months[k])state.months[k]={deposits:[],meals:[],bazar:[]};return state.months[k]}
function calc(){let d=data(),totalExpense=0,totalMeals=0,mealByMember=new Map(),depositByMember=new Map();for(const x of d.bazar)totalExpense+=Number(x.amount||0);for(const x of d.meals){let n=Number(x.count||0);totalMeals+=n;mealByMember.set(x.memberId,(mealByMember.get(x.memberId)||0)+n)}for(const x of d.deposits)depositByMember.set(x.memberId,(depositByMember.get(x.memberId)||0)+Number(x.amount||0));let rate=totalMeals?totalExpense/totalMeals:0,rows=state.members.map(m=>{let meals=mealByMember.get(m.id)||0,deposit=depositByMember.get(m.id)||0,cost=meals*rate;return {...m,meals,deposit,cost,balance:deposit-cost}});return {d,totalExpense,totalMeals,rate,rows,totalDeposit:rows.reduce((s,x)=>s+x.deposit,0),totalRemaining:rows.reduce((s,x)=>s+x.balance,0)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(){const c=tab==='members'?{d:data()}:(['home','meals','bazar','reports'].includes(tab)?calc():null);const memberNameById=tab==='members'?new Map(state.members.map(m=>[m.id,m.name])):null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let html='';
if(tab==='home'){
 const activeDays=new Map();
 c.d.meals.forEach(x=>{let v=activeDays.get(x.date)||{meals:0,expense:0};v.meals+=Number(x.count||0);activeDays.set(x.date,v)});
 c.d.bazar.forEach(x=>{let v=activeDays.get(x.date)||{meals:0,expense:0};v.expense+=Number(x.amount||0);activeDays.set(x.date,v)});
 const activity=[...activeDays.entries()].sort((a,b)=>a[0].localeCompare(b[0])).slice(-7);
 const maxActivity=Math.max(1,...activity.map(x=>Math.max(x[1].meals,x[1].expense/Math.max(c.rate,1))));
 const topMembers=[...c.rows].sort((a,b)=>b.meals-a.meals).slice(0,4);
 const dueMembers=c.rows.filter(m=>m.balance<0).length;
 html=`<div class="dash-welcome"><div><div class="dash-eyebrow">MONTHLY OVERVIEW</div><h2>Your meal account</h2><p>${key()} · ${c.rows.length} members</p></div><div class="dash-emoji">🍽️</div></div>
 <div class="dash-kpis">
  <div class="card metric dash-blue"><small>Total deposits</small><strong>${money(c.totalDeposit)}</strong><span>Net received / adjustments</span></div>
  <div class="card metric dash-pink"><small>Bazar expenses</small><strong>${money(c.totalExpense)}</strong><span>${c.d.bazar.length} expense entries</span></div>
  <div class="card metric dash-yellow"><small>Remaining balance</small><strong>${money(c.totalRemaining)}</strong><span>Deposits minus meal costs</span></div>
  <div class="card metric dash-teal"><small>Total meal units</small><strong>${Number(c.totalMeals.toFixed(2))}</strong><span>Meal rate ${money(c.rate)}</span></div>
 </div>
 <div class="dash-actions">
  <button class="dash-action action-meal" onclick="navigateTo('meals')"><span>🍛</span><b>Add meals</b><small>Daily entries</small></button>
  <button class="dash-action action-bazar" onclick="navigateTo('bazar')"><span>🛒</span><b>Add bazar</b><small>Record expense</small></button>
  <button class="dash-action action-deposit" onclick="navigateTo('members')"><span>💳</span><b>Add deposit</b><small>Member payment</small></button>
  <button class="dash-action action-report" onclick="navigateTo('reports')"><span>📊</span><b>View report</b><small>Monthly summary</small></button>
 </div>
 <div class="sectionhead"><h2>Activity overview</h2><span class="pill">${activity.length} active days</span></div>
 <div class="card dash-chart-card"><div class="dash-chart-head"><div><b>Daily activity</b><div class="hint">Meal units and bazar spending by date</div></div><span class="dash-chart-key"><i class="key-meal"></i> Meals <i class="key-expense"></i> Bazar</span></div>
 ${activity.length?`<div class="dash-bars">${activity.map(([date,v])=>`<div class="dash-bar-col"><div class="dash-bar-pair"><div class="dash-bar meal-bar" style="height:${Math.max(4,v.meals/maxActivity*100)}%" title="${v.meals} meal units"></div><div class="dash-bar expense-bar" style="height:${Math.max(4,(v.expense/Math.max(c.rate,1))/maxActivity*100)}%" title="${money(v.expense)} bazar"></div></div><small>${date.slice(8)}</small></div>`).join('')}</div><div class="dash-chart-foot"><span>Lower activity</span><span>Higher activity</span></div>`:'<div class="empty">Your daily activity chart will appear when meals or bazar entries are added.</div>'}
 </div>
 <div class="dash-two-col">

if(tab==='about'){html=`<div class="card" style="text-align:center;padding:24px 18px"><div style="width:92px;height:92px;margin:0 auto 12px;border-radius:24px;background:linear-gradient(145deg,#087a3d,#07552f);display:grid;place-items:center;color:white;font-size:48px;box-shadow:0 6px 18px #07552f33">🍽️</div><h2 style="font-size:24px;margin:0;color:#176b57">Meal Manager</h2><p class="muted" style="margin:6px 0 0">Manage your meal expenses with ease!</p></div><div class="card"><h3 style="margin:0 0 10px;color:#176b57">About this app</h3><p style="line-height:1.65;margin:0">Meal Manager helps you manage shared household, family or hostel meal expenses. Track members, deposits, daily meals, bazar expenses, meal rates and monthly reports — all in one place.</p><div class="row"><span>✓ Offline data storage</span><span class="pill">Available</span></div><div class="row"><span>✓ Google Sheets synchronization</span><span class="pill">Supported</span></div></div><div class="card"><div style="display:flex;align-items:center;gap:13px"><img src="profile-shibly.jpg" alt="Shibly" style="width:76px;height:76px;object-fit:cover;object-position:center 28%;border-radius:50%;border:3px solid #dceee5;box-shadow:0 2px 8px #123b3522"><div><div class="muted">Developed by</div><strong style="font-size:19px">Shibly</strong><div class="hint">Meal Manager developer</div></div></div><a href="https://www.facebook.com/shibly6" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:12px;margin-top:18px;padding:12px;background:#eef5ff;border-radius:12px;color:#0866ff;text-decoration:none;font-weight:650"><span style="font-size:25px">ⓕ</span><span>Find me on Facebook<br><small style="font-weight:400">facebook.com/shibly6</small></span><span style="margin-left:auto">↗</span></a></div><div class="card" style="text-align:center"><div class="muted">App version</div><strong>${APP_VERSION}</strong><p class="hint" style="margin-bottom:0">Thank you for using Meal Manager!</p></div>`}
if(tab==='sync'){html=`<div class="sectionhead"><h2>Google Sheets sync</h2><span class="pill">Offline-first</span></div><div class="card"><label>Apps Script Web App URL</label><input id="endpoint" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(state.settings.endpoint)}"><label>Access token</label><input id="syncToken" type="password" placeholder="Same secret as APP_TOKEN in Apps Script" value="${esc(state.settings.token)}"><button class="btn secondary" onclick="saveEndpoint()">Save settings</button><p class="hint">Your entries remain on this phone when offline. Deploy the included Google Apps Script to your spreadsheet, paste its Web App URL here, then use Sync to upload or download data.</p><div class="syncbox">Spreadsheet ID: 1-5X3oN-BW_MQLFROe5WgakP3AoLvBbnn0NeRzpsnL2Y</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" onclick="syncNow('push')">Upload to Sheets</button><button class="btn secondary" onclick="syncNow('pull')">Download from Sheets</button></div><div id="syncStatus" class="status"></div></div><div class="card"><b>Local backup</b><p class="hint">Export a JSON backup before changing phones. Restore it later on this device.</p><button class="btn secondary" onclick="backup()">Export backup</button><label style="display:block;margin-top:15px">Restore backup</label><input id="restoreFile" type="file" accept="application/json"><button class="btn secondary" onclick="restore()">Restore JSON</button></div>`}
$('#app').innerHTML=html; 
if(tab==='members')$('#memberForm')?.addEventListener('submit',e=>{e.preventDefault();let name=new FormData(e.target).get('name').trim();if(name){state.members.push({id:uid(),name});save();show()}});
if(tab==='members')$('#depositForm')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);data().deposits.push({id:uid(),memberId:f.get('memberId'),date:f.get('date'),amount:Number(f.get('amount'))});save();show()});
if(tab==='meals')$('#mealForm')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),d=data();let date=f.get('date');let old=d.meals.find(x=>x.memberId===f.get('memberId')&&x.date===date);if(old)old.count=Number(old.count)+Number(f.get('count'));else d.meals.push({id:uid(),memberId:f.get('memberId'),date,count:Number(f.get('count'))});save();show()});
if(tab==='bazar')$('#bazarForm')?.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);data().bazar.push({id:uid(),date:f.get('date'),name:f.get('name'),amount:Number(f.get('amount')),note:f.get('note')});save();show()});
}
function removeMember(id){if(!confirm('Remove this member? Existing historical entries are retained.'))return;state.members=state.members.filter(m=>m.id!==id);save();show()}
function removeEntry(type,id){
 let d=data(),entry=d[type].find(x=>x.id===id);
 if(!entry)return;
 let message='';
 if(type==='meals'){
  let member=state.members.find(m=>m.id===entry.memberId);
  message=`Delete this meal entry?\n\nMember: ${member?.name||'Removed member'}\nDate: ${entry.date}\nMeal units: ${entry.count}\n\nOnly this meal entry will be deleted.`;
 }else if(type==='bazar'){
  message=`Delete this bazar entry?\n\nBuyer: ${entry.name}\nDate: ${entry.date}\nAmount: ${money(entry.amount)}\nNote: ${entry.note||'Bazar'}\n\nOnly this bazar entry will be deleted.`;
 }else if(type==='deposits'){
  let member=state.members.find(m=>m.id===entry.memberId);
  message=`Delete this deposit entry?\n\nMember: ${member?.name||'Removed member'}\nDate: ${entry.date}\nAmount: ${money(entry.amount)}\n\nOnly this deposit entry will be deleted.`;
 }else{
  message='Are you sure you want to delete this entry?';
 }
 if(!confirm(message))return;
 d[type]=d[type].filter(x=>x.id!==id);save();show()
}
function saveEndpoint(){state.settings.endpoint=$('#endpoint').value.trim();state.settings.token=$('#syncToken').value.trim();save();$('#syncStatus').textContent='Sync settings saved on this phone.'}
function syncNow(mode){let el=$('#syncStatus'),url=state.settings.endpoint;if(!url){el.className='status bad';el.textContent='Enter and save your Apps Script URL first.';return}try{let response,token=state.settings.token;if(!token)throw Error('Enter the access token configured in Apps Script.');if(mode==='push'){response=MealBridge.request('POST',url,JSON.stringify({action:'save',token,data:state}));}else{response=MealBridge.request('GET',url+'?action=load&token='+encodeURIComponent(token),'');}let result=JSON.parse(response);if(result.error||result.ok===false)throw Error(result.error||result.message||'Sync failed');if(mode==='pull'){if(!result.data)throw Error('No saved data returned');state=result.data;save();show();}el=$('#syncStatus');el.className='status good';el.textContent=mode==='push'?'Upload complete. Google Sheets has the latest app data.':'Download complete. Local data has been replaced with the sheet backup.'}catch(e){el=$('#syncStatus');el.className='status bad';el.textContent='Sync failed: '+e.message}}
function exportCSV(){let c=calc(),lines=[['Member','Meals','Net deposit / adjustment (BDT)','Meal cost (BDT)','Remaining balance (BDT)'],...c.rows.map(m=>[m.name,m.meals,m.deposit,m.cost,m.balance])];let csv=lines.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');download(csv,'meal-report-'+key()+'.csv','text/csv')}
function backup(){let json=JSON.stringify(state,null,2);if(window.MealBridge&&MealBridge.exportBackup){MealBridge.exportBackup(json)}else{download(json,'meal-manager-backup.json','application/json')}}
function download(content,name,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function restore(){if(window.MealBridge&&MealBridge.pickBackup){MealBridge.pickBackup();return}let f=$('#restoreFile').files[0];if(!f)return alert('Choose a JSON backup first.');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.members||!x.months)throw Error('Invalid backup');state=x;save();show();alert('Backup restored.')}catch(e){alert('Could not restore: '+e.message)}};r.readAsText(f)}
window.restoreFromNative=function(raw){try{let x=JSON.parse(raw);if(!x.members||!x.months)throw Error('Invalid backup');state=x;save();show();alert('Backup restored successfully.')}catch(e){alert('Could not restore: '+e.message)}}
$('#month').value=monthNow();$('#month').addEventListener('change',show);
const tabOrder=['home','members','meals','bazar','reports','sync','about'];
let navigationBusy=false;
function navigateTo(next){
 if(next===tab||navigationBusy)return;
 const oldIndex=tabOrder.indexOf(tab),newIndex=tabOrder.indexOf(next);
 const direction=newIndex>oldIndex?1:-1;
 navigationBusy=true;
 try{
  tab=next;
  show();
  const active=$('#nav button.active');
  if(active)active.scrollIntoView({behavior:'auto',block:'nearest',inline:'center'});
  const fresh=$('#app');
  if(fresh&&fresh.animate){
   fresh.animate(
    [{transform:`translate3d(${direction*18}px,0,0)`,opacity:.65},
     {transform:'translate3d(0,0,0)',opacity:1}],
    {duration:155,easing:'cubic-bezier(.2,.75,.25,1)'}
   );
  }
 }catch(e){/* Keep navigation usable if animation is unavailable. */}
 finally{navigationBusy=false;}
}
function moveTab(direction){let current=tabOrder.indexOf(tab),next=Math.max(0,Math.min(tabOrder.length-1,current+direction));if(next===current)return;navigateTo(tabOrder[next]);}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-tab]');if(b)navigateTo(b.dataset.tab)});
let swipeStartX=0,swipeStartY=0;
$('#app').addEventListener('touchstart',e=>{if(e.touches.length!==1)return;let t=e.target;if(t.closest('textarea,button,a,[contenteditable="true"]')){swipeStartX=0;return;}swipeStartX=e.touches[0].clientX;swipeStartY=e.touches[0].clientY;},{passive:true});
$('#app').addEventListener('touchend',e=>{if(!swipeStartX||!e.changedTouches.length)return;let dx=e.changedTouches[0].clientX-swipeStartX,dy=e.changedTouches[0].clientY-swipeStartY;swipeStartX=0;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.2)moveTab(dx<0?1:-1);},{passive:true});$('#app').addEventListener('touchcancel',()=>{swipeStartX=0;swipeStartY=0;},{passive:true});
show();
</script></body></html>

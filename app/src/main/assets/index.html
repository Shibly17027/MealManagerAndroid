/* Brighter Emerald & Cream theme + persistent light/dark mode */
:root{
 --bg:#f4f8f4;--card:#ffffff;--ink:#244237;--muted:#71877b;
 --green:#29966f;--line:#e1ebe4;--red:#c94f55;
 --emerald-deep:#1b7659;--emerald-soft:#eaf6ef;--mint:#d9f0e2;
 color-scheme:light;
}
html[data-theme="light"] body,body{background:linear-gradient(180deg,#edf7f0 0,#f4f8f4 280px);color:var(--ink)}
header{background:linear-gradient(115deg,#1b7659 0%,#29966f 58%,#43ad80 100%);box-shadow:0 7px 22px #237b5a20;padding-right:104px}
header h1{color:#fff}
header small{color:#f0fff6;opacity:1}
.monthbar input{background:#fff;color:#244237;border:1px solid #dcebe1;box-shadow:0 3px 10px #1d674414}
nav{background:#fffffff2;border-color:#e1ebe4;box-shadow:0 4px 14px #1b76590d;backdrop-filter:blur(12px);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:#f0f7f2;color:#657b6e;border-radius:12px;padding:10px 14px}
nav button.active{background:linear-gradient(135deg,#268b67,#39a779);color:#fff;border:0;box-shadow:0 4px 12px #29966f35}
.card{background:var(--card);border-color:var(--line);box-shadow:0 5px 17px #244b3510;border-radius:19px}
.sectionhead h2{color:#244237}
.btn{background:linear-gradient(135deg,#258b66,#39a779);box-shadow:0 3px 9px #258b6626;border-radius:12px}
.btn.secondary{background:#e8f5ed;color:#207d5b;box-shadow:none}
.btn.danger{background:#fff0ef;color:#bd4b50;box-shadow:none}
.pill{background:#e7f5ec;color:#207d5b}
.row{border-color:#e5eee8}
.row .sub,.muted,.hint,.metric small{color:#71877b}
.amount{color:#29483b}
input,select,textarea{background:#fff;color:#244237;border-color:#d8e7dd;border-radius:12px;box-shadow:0 2px 6px #244b3508}
input:focus,select:focus,textarea:focus{outline:2px solid #b5e3c9;border-color:#39a779}
label{color:#526d5e}
.syncbox{background:linear-gradient(135deg,#eef8f1,#f5faf5);border:1px solid #dfede3;color:#456554;border-radius:12px}
.good,.dash-positive,.positive{color:#21875f}
.bad,.dash-negative,.negative{color:#c94f55}
.metric{--metric-color:#268b66;--metric-orb:#d7f0e1;--metric-bg:#f6fbf7;--metric-border:#e0eee5;--metric-shadow:#29966f12}
.grid .metric:nth-child(1),.dash-kpis .dash-blue{--metric-bg:#eaf7ef;--metric-border:#d2eadb;--metric-color:#23865f;--metric-orb:#c9ead5}
.grid .metric:nth-child(2),.dash-kpis .dash-pink{--metric-bg:#fff1ef;--metric-border:#f3ddd8;--metric-color:#bd6552;--metric-orb:#f7d9d1}
.grid .metric:nth-child(3),.dash-kpis .dash-yellow{--metric-bg:#fff8e8;--metric-border:#f1e7c9;--metric-color:#987322;--metric-orb:#f5e9c5}
.grid .metric:nth-child(4),.dash-kpis .dash-teal{--metric-bg:#e9f7f4;--metric-border:#d3ebe4;--metric-color:#258276;--metric-orb:#ccebe3}
.grid .metric:nth-child(5){--metric-bg:#f1f5eb;--metric-border:#e1e9d8;--metric-color:#6d824d;--metric-orb:#dce9cf}
.dash-welcome{background:linear-gradient(120deg,#1b7659,#29966f 62%,#43ad80);box-shadow:0 9px 22px #258b6628}
.dash-kpis .metric span{color:#688174}
.dash-action{background:#fff;border-color:#e1ebe4;color:#29483b;box-shadow:0 4px 12px #244b350c}
.action-meal,.action-deposit{background:#edf8f1}.action-bazar{background:#fff3ef}.action-report{background:#f1f6ed}
.dash-chart-key{color:#71877b}.key-meal{background:#329d75}.key-expense{background:#d18a64}
.dash-bars{border-color:#e1ebe4}.meal-bar{background:linear-gradient(180deg,#79cda2,#29966f)}.expense-bar{background:linear-gradient(180deg,#f0b89c,#c77c58)}
.dash-avatar{background:#e7f5ec;color:#207d5b}.dash-leader{border-color:#e5eee8}.dash-rank{background:#e7f5ec;color:#207d5b}
.dash-progress{background:#e5eee8}.dash-progress i{background:linear-gradient(90deg,#29966f,#76c99a)}
.dash-note{border-color:#dceee2;background:linear-gradient(120deg,#edf8f1,#f7fbf5);color:#4d6959}.dash-note small{color:#71877b}
.about-link,.facebook-link{background:#e7f5ec!important;color:#207d5b!important}

/* Dark mode: brighter emerald accents with softer charcoal-green surfaces */

 color-scheme:dark;
 --bg:#15241c;--card:#203329;--ink:#e7f2ea;--muted:#a8bcb0;
 --green:#75cfa0;--line:#354e40;--red:#ff8985;
}

html[data-theme="dark"] .card,html[data-theme="dark"] .dash-action{background:#203329;border-color:#354e40;box-shadow:0 5px 18px #00000020}

html[data-theme="dark"] .btn{background:linear-gradient(135deg,#23875e,#35a675);color:#fff}
html[data-theme="dark"] .btn.secondary{background:#315541;color:#c5efd4;box-shadow:none}

</style></head><body>
<header><button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch colour theme">☾ Dark</button><h1>🍽️ Meal Manager</h1><small>Offline-first • Monthly accounts</small><div class="monthbar"><label style="color:white">Month</label><input id="month" type="month"></div></header>
<nav id="nav"><button data-tab="home" class="active">Overview</button><button data-tab="history">History</button><button data-tab="members">Members</button><button data-tab="meals">Meals</button><button data-tab="bazar">Bazar</button><button data-tab="reports">Reports</button><button data-tab="sync">Sync</button><button data-tab="about">About</button></nav>
<main id="app"></main>
<script>
const APP_VERSION='1.9.0';
const $=s=>document.querySelector(s), money=n=>'৳ '+(Number(n)||0).toLocaleString('en-BD',{maximumFractionDigits:2}), today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}, monthNow=()=>today().slice(0,7), uid=()=>Math.random().toString(36).slice(2,10);
let state=JSON.parse(localStorage.getItem('mealManagerData')||'null')||{members:[],months:{},settings:{endpoint:'',token:''}};let tab='home';
function save(){localStorage.setItem('mealManagerData',JSON.stringify(state))}function key(){return $('#month').value||monthNow()}function data(){let k=key();if(!state.months[k])state.months[k]={deposits:[],meals:[],bazar:[]};return state.months[k]}
function calc(){let d=data(),totalExpense=0,totalMeals=0,mealByMember=new Map(),depositByMember=new Map();for(const x of d.bazar)totalExpense+=Number(x.amount||0);for(const x of d.meals){let n=Number(x.count||0);totalMeals+=n;mealByMember.set(x.memberId,(mealByMember.get(x.memberId)||0)+n)}for(const x of d.deposits)depositByMember.set(x.memberId,(depositByMember.get(x.memberId)||0)+Number(x.amount||0));let rate=totalMeals?totalExpense/totalMeals:0,rows=state.members.map(m=>{let meals=mealByMember.get(m.id)||0,deposit=depositByMember.get(m.id)||0,cost=meals*rate;return {...m,meals,deposit,cost,balance:deposit-cost}});return {d,totalExpense,totalMeals,rate,rows,totalDeposit:rows.reduce((s,x)=>s+x.deposit,0),totalRemaining:rows.reduce((s,x)=>s+x.balance,0)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function themedDialog({title='Meal Manager',message='',value='',placeholder='',inputType='text',confirmText='Continue',cancelText='Cancel',danger=false,showInput=false}={}){
 return new Promise(resolve=>{
  const overlay=document.createElement('div');overlay.className='mm-overlay';overlay.innerHTML=`<section class="mm-dialog" role="dialog" aria-modal="true" aria-labelledby="mmDialogTitle"><h3 id="mmDialogTitle">${esc(title)}</h3><p>${esc(message)}</p>${showInput?`<input id="mmDialogInput" type="${inputType}" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off">`:''}<div class="mm-dialog-actions"><button type="button" class="mm-cancel">${esc(cancelText)}</button><button type="button" class="${danger?'mm-delete':'mm-ok'}">${esc(confirmText)}</button></div></section>`;
  document.body.appendChild(overlay);const field=overlay.querySelector('input'),finish=result=>{overlay.remove();resolve(result)};
  overlay.querySelector('.mm-cancel').onclick=()=>finish(showInput?null:false);overlay.querySelector('.mm-ok,.mm-delete').onclick=()=>finish(showInput?(field.value):true);
  overlay.addEventListener('click',e=>{if(e.target===overlay)finish(showInput?null:false)});overlay.addEventListener('keydown',e=>{if(e.key==='Escape')finish(showInput?null:false);if(e.key==='Enter'&&showInput)finish(field.value)});if(field){field.focus();field.select()}
 });
}
function themedConfirm(message,title='Please confirm',danger=true){return themedDialog({title,message,confirmText:'Confirm',danger})}
function themedPrompt(message,value='',title='Edit details',inputType='text'){return themedDialog({title,message,value:String(value??''),inputType,showInput:true,confirmText:'Save'})}
function themedAlert(message,title='Notice'){return themedDialog({title,message,confirmText:'OK',cancelText:'Close'}).then(()=>true)}

function openMemberPicker(inputId){
 const input=document.getElementById(inputId),trigger=document.getElementById(inputId+'Button');if(!input||!trigger)return;
 const overlay=document.createElement('div');overlay.className='mm-overlay';overlay.innerHTML=`<section class="mm-dialog" role="dialog" aria-modal="true" aria-labelledby="mmMemberTitle"><h2 id="mmMemberTitle">Select member</h2><p>Choose a member for this entry.</p><div class="mm-member-list">${state.members.length?state.members.map(m=>`<button type="button" class="mm-member-option ${m.id===input.value?'selected':''}" data-member-id="${esc(m.id)}"><span class="mm-member-avatar">${esc((m.name||'?').trim().charAt(0).toUpperCase())}</span><span>${esc(m.name)}</span>${m.id===input.value?'<span class="mm-member-check">✓</span>':''}</button>`).join(''):'<div class="mm-member-empty">No members added yet.</div>'}</div><div class="mm-dialog-actions"><button type="button" class="mm-cancel">Cancel</button></div></section>`;
 document.body.appendChild(overlay);const close=()=>overlay.remove();overlay.querySelector('.mm-cancel').onclick=close;overlay.addEventListener('click',e=>{if(e.target===overlay)close()});overlay.addEventListener('keydown',e=>{if(e.key==='Escape')close()});overlay.querySelectorAll('[data-member-id]').forEach(btn=>btn.onclick=()=>{const member=state.members.find(m=>m.id===btn.dataset.memberId);if(!member)return;input.value=member.id;trigger.innerHTML=`${esc(member.name)}<span aria-hidden="true">⌄</span>`;close()});const first=overlay.querySelector('[data-member-id]');if(first)first.focus();
}

function show(){const c=tab==='members'?{d:data()}:(['home','meals','bazar','reports','history'].includes(tab)?calc():null);const memberNameById=tab==='members'?new Map(state.members.map(m=>[m.id,m.name])):null;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let html='';
if(tab==='home'){
 const activeDays=new Map();
 c.d.meals.forEach(x=>{let v=activeDays.get(x.date)||{meals:0,expense:0};v.meals+=Number(x.count||0);activeDays.set(x.date,v)});
 c.d.bazar.forEach(x=>{let v=activeDays.get(x.date)||{meals:0,expense:0};v.expense+=Number(x.amount||0);activeDays.set(x.date,v)});
 const activity=[...activeDays.entries()].sort((a,b)=>a[0].localeCompare(b[0])).slice(-7);
 const maxActivity=Math.max(1,...activity.map(x=>Math.max(x[1].meals,x[1].expense/Math.max(c.rate,1))));
 const topMembers=[...c.rows].sort((a,b)=>b.meals-a.meals).slice(0,4);
 const dueMembers=c.rows.filter(m=>m.balance<0).length;
 html=`<div class="dash-welcome"><div><div class="dash-eyebrow">MONTHLY OVERVIEW</div><h2>Your meal account</h2><p>${key()} · ${c.rows.length} members</p></div><div class="dash-emoji">🍽️</div></div>
 <div class="dash-kpis">
  <div class="card metric dash-blue"><small>Total deposits</small><strong>${money(c.totalDeposit)}</strong><span>Net received / adjustments</span></div>
  <div class="card metric dash-pink"><small>Bazar expenses</small><strong>${money(c.totalExpense)}</strong><span>${c.d.bazar.length} expense entries</span></div>
  <div class="card metric dash-yellow"><small>Remaining balance</small><strong>${money(c.totalRemaining)}</strong><span>Deposits minus meal costs</span></div>
  <div class="card metric dash-teal"><small>Total meal units</small><strong>${Number(c.totalMeals.toFixed(2))}</strong><span>Meal rate ${money(c.rate)}</span></div>
 </div>
 <div class="dash-actions">
  <button class="dash-action action-meal" onclick="navigateTo('meals')"><span>🍛</span><b>Add meals</b><small>Daily entries</small></button>
  <button class="dash-action action-bazar" onclick="navigateTo('bazar')"><span>🛒</span><b>Add bazar</b><small>Record expense</small></button>
  <button class="dash-action action-deposit" onclick="navigateTo('members')"><span>💳</span><b>Add deposit</b><small>Member payment</small></button>
  <button class="dash-action action-report" onclick="navigateTo('reports')"><span>📊</span><b>View report</b><small>Monthly summary</small></button>
 </div>
 <div class="sectionhead"><h2>Activity overview</h2><span class="pill">${activity.length} active days</span></div>
 <div class="card dash-chart-card"><div class="dash-chart-head"><div><b>Daily activity</b><div class="hint">Meal units and bazar spending by date</div></div><span class="dash-chart-key"><i class="key-meal"></i> Meals <i class="key-expense"></i> Bazar</span></div>
 ${activity.length?`<div class="dash-bars">${activity.map(([date,v])=>`<div class="dash-bar-col"><div class="dash-bar-pair"><div class="dash-bar meal-bar" style="height:${Math.max(4,v.meals/maxActivity*100)}%" title="${v.meals} meal units"></div><div class="dash-bar expense-bar" style="height:${Math.max(4,(v.expense/Math.max(c.rate,1))/maxActivity*100)}%" title="${money(v.expense)} bazar"></div></div><small>${date.slice(8)}</small></div>`).join('')}</div><div class="dash-chart-foot"><span>Lower activity</span><span>Higher activity</span></div>`:'<div class="empty">Your daily activity chart will appear when meals or bazar entries are added.</div>'}
 </div>
 <div class="dash-two-col">
  <div><div class="sectionhead"><h2>Member balances</h2><span class="pill">${c.rows.length} total</span></div><div class="card">${c.rows.length?c.rows.slice().sort((a,b)=>a.balance-b.balance).slice(0,5).map(m=>`<div class="row"><div class="dash-member"><span class="dash-avatar">${esc(m.name).slice(0,1).toUpperCase()}</span><div><b>${esc(m.name)}</b><div class="sub">${m.meals} meals · ${money(m.deposit)} deposited</div></div></div><div class="amount ${m.balance<0?'dash-negative':'dash-positive'}">${money(m.balance)}<div class="sub">${m.balance<0?'Due':'Remaining'}</div></div></div>`).join(''):'<div class="empty">Add members to start your monthly account.</div>'}<button class="btn secondary small dash-full-btn" onclick="navigateTo('members')">Manage members</button></div></div>
  <div><div class="sectionhead"><h2>Meal leaders</h2><span class="pill">Top 4</span></div><div class="card">${topMembers.length?topMembers.map((m,i)=>`<div class="dash-leader"><span class="dash-rank">${i+1}</span><div class="dash-leader-info"><b>${esc(m.name)}</b><div class="dash-progress"><i style="width:${Math.max(3,m.meals/Math.max(1,topMembers[0].meals)*100)}%"></i></div></div><strong>${m.meals}</strong></div>`).join(''):'<div class="empty">Meal totals will appear here.</div>'}</div></div>
 </div>
 <div class="dash-note"><span>ℹ️</span><div><b>How your balance is calculated</b><p>Meal rate = bazar expenses ÷ meal units. Member balance = deposits − (member meals × meal rate).</p><small>${dueMembers?dueMembers+' member(s) currently have a due balance.':'No member has a negative balance this month.'}</small></div></div>`;
}
if(tab==='history'){html=`<div class="sectionhead"><h2>Transaction history</h2><span class="pill">${key()}</span></div><div class="card"><label>Search records</label><input id="historySearch" type="search" placeholder="Search member, buyer, note or date"><label>Transaction type</label><input id="historyType" type="hidden" value="all"><button type="button" class="mm-member-trigger" id="historyTypeButton" onclick="openTransactionTypePicker()">All transactions<span aria-hidden="true">⌄</span></button><div class="hint">Showing a read-only record of transactions for the selected month.</div></div><div id="historyResults"></div>`}
if(tab==='members'){html=`<div class="sectionhead"><h2>Members</h2><span class="pill">${state.members.length} total</span></div><div class="card"><form id="memberForm"><label>Member name</label><input name="name" required placeholder="Enter member name"><button class="btn">+ Add member</button></form></div><div class="card"><div class="sectionhead" style="margin-top:0"><h2>Record deposit</h2></div><form id="depositForm"><label>Member</label><input type="hidden" name="memberId" id="depositMemberId" value="${state.members[0]?.id||''}"><button type="button" class="mm-member-trigger" onclick="openMemberPicker('depositMemberId')" id="depositMemberIdButton">${esc(state.members[0]?.name||'Choose a member')}<span aria-hidden="true">⌄</span></button><div class="formgrid"><div><label>Date</label><input name="date" type="date" value="${today().slice(0,7)===key()?today():key()+'-01'}" required></div><div><label>Amount (৳)</label><input name="amount" type="number" step="0.01" required placeholder="e.g. 1000 or -500"></div></div><p class="hint">Enter a positive amount for cash received. Enter a negative amount for a previous-month due (e.g. -500).</p><button class="btn" ${!state.members.length?'disabled':''}>+ Add deposit</button></form></div><div class="card"><b>Members</b>${state.members.length?state.members.map((m,i)=>`<div class="row"><div><b>${i+1}. ${esc(m.name)}</b></div><button class="btn danger small" onclick="removeMember('${m.id}')">Remove</button></div>`).join(''):'<div class="empty">No members added yet.</div>'}</div><div class="card"><b>Deposits this month</b>${c.d.deposits.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="row"><div><b>${esc(memberNameById.get(x.memberId)||'Removed member')}</b><div class="sub">${x.date}</div></div><div class="amount">${money(x.amount)} <button class="btn danger small" onclick="removeEntry('deposits','${x.id}')">×</button></div></div>`).join('')||'<div class="empty">No deposits recorded for this month.</div>'}</div>`}

function openTransactionTypePicker(){

 const options=[{value:'all',label:'All transactions',icon:'📋',desc:'Show every transaction'},{value:'deposits',label:'Deposits',icon:'💳',desc:'Member payments and adjustments'},{value:'bazar',label:'Bazar expenses',icon:'🛒',desc:'Shopping and shared expenses'},{value:'meals',label:'Meal entries',icon:'🍽️',desc:'Daily member meal records'}];
 const overlay=document.createElement('div');overlay.className='mm-overlay';overlay.innerHTML=`<section class="mm-dialog" role="dialog" aria-modal="true" aria-labelledby="mmTypeTitle"><h2 id="mmTypeTitle">Transaction type</h2><p>Choose which transactions to display.</p><div class="mm-member-list">${options.map(o=>`<button type="button" class="mm-member-option ${o.value===input.value?'selected':''}" data-type-value="${o.value}"><span class="mm-member-avatar">${o.icon}</span><span><strong>${o.label}</strong><small style="display:block;font-weight:400;opacity:.75;margin-top:3px">${o.desc}</small></span>${o.value===input.value?'<span class="mm-member-check">✓</span>':''}</button>`).join('')}</div><div class="mm-dialog-actions"><button type="button" class="mm-cancel">Cancel</button></div></section>`;
 document.body.appendChild(overlay);const close=()=>overlay.remove();overlay.querySelector('.mm-cancel').onclick=close;overlay.addEventListener('click',e=>{if(e.target===overlay)close()});overlay.addEventListener('keydown',e=>{if(e.key==='Escape')close()});overlay.querySelectorAll('[data-type-value]').forEach(btn=>btn.onclick=()=>{const option=options.find(o=>o.value===btn.dataset.typeValue);if(!option)return;input.value=option.value;trigger.innerHTML=`${option.label}<span aria-hidden="true">⌄</span>`;close();renderHistoryList()});const selected=overlay.querySelector('.selected');if(selected)selected.focus();
}

function renderHistoryList(){
 const host=$('#historyResults');if(!host)return;
 const d=data(),q=($('#historySearch')?.value||'').trim().toLowerCase(),type=$('#historyType')?.value||'all';
 const names=new Map(state.members.map(m=>[m.id,m.name]));
 let items=[];
 d.deposits.forEach(x=>items.push({type:'deposits',id:x.id,date:x.date,title:names.get(x.memberId)||'Removed member',detail:'Deposit',amount:Number(x.amount||0),search:`${names.get(x.memberId)||'Removed member'} deposit ${x.date} ${x.amount}`}));
 d.bazar.forEach(x=>items.push({type:'bazar',id:x.id,date:x.date,title:x.name||'Bazar expense',detail:x.note||'Bazar expense',amount:Number(x.amount||0),search:`${x.name||''} ${x.note||''} bazar ${x.date} ${x.amount}`}));
 d.meals.forEach(x=>items.push({type:'meals',id:x.id,date:x.date,title:names.get(x.memberId)||'Removed member',detail:'Meal entry',amount:Number(x.count||0),search:`${names.get(x.memberId)||'Removed member'} meals ${x.date} ${x.count}`}));
 items=items.filter(x=>(type==='all'||x.type===type)&&(!q||x.search.toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||a.type.localeCompare(b.type));
 if(!items.length){host.innerHTML='<div class="card empty">No matching transactions found for this month.</div>';return;}
 const groups=new Map();items.forEach(x=>{if(!groups.has(x.date))groups.set(x.date,[]);groups.get(x.date).push(x)});
 host.innerHTML=[...groups.entries()].map(([date,rows])=>`<div class="sectionhead"><h2>${date}</h2><span class="pill">${rows.length} record${rows.length===1?'':'s'}</span></div><div class="card">${rows.map(x=>{let label=x.type==='deposits'?'Deposit':x.type==='bazar'?'Bazar':'Meals',value=x.type==='meals'?`${x.amount} units`:money(x.amount),color=x.type==='deposits'?'#27896f':x.type==='bazar'?'#cf527f':'#3979bd';return `<div class="history-item"><div class="history-item-main"><b>${esc(x.title)}</b><div class="sub">${label} · ${esc(x.detail)}</div></div><div class="history-item-value" style="color:${color}">${value}</div></div>`}).join('')}</div>`).join('');
}
async function editEntry(type,id){
 const d=data(),entry=d[type]?.find(x=>x.id===id);if(!entry)return;
 let date=await themedPrompt('Date (YYYY-MM-DD):',entry.date,'Edit date');if(date===null)return;
 const dateMatch=/^(\d{4})-(\d{2})-(\d{2})$/.exec(date.trim());
 if(!dateMatch){await themedAlert('Please enter a valid date within the selected month.');return;}
 const year=Number(dateMatch[1]),month=Number(dateMatch[2]),day=Number(dateMatch[3]);
 const daysInMonth=new Date(Date.UTC(year,month,0)).getUTCDate();
 if(month<1||month>12||day<1||day>daysInMonth||date.trim().slice(0,7)!==key()){await themedAlert('Please enter a valid date within the selected month.');return;}
 date=date.trim();
 if(type==='deposits'){
  const amount=await themedPrompt('Deposit amount (BDT):',entry.amount,'Edit deposit','number');if(amount===null)return;if(amount.trim()===''||!Number.isFinite(Number(amount))){await themedAlert('Enter a valid amount.');return;}entry.amount=Number(amount);
 }else if(type==='bazar'){
  const name=await themedPrompt('Buyer / name:',entry.name||'','Edit bazar entry');if(name===null)return;
  const amount=await themedPrompt('Expense amount (BDT):',entry.amount,'Edit amount','number');if(amount===null)return;if(!(Number(amount)>0)){await themedAlert('Enter an amount greater than zero.');return;}
  const note=await themedPrompt('Note:',entry.note||'','Edit note');if(note===null)return;entry.name=name.trim();entry.amount=Number(amount);entry.note=note.trim();
 }else{
  const count=await themedPrompt('Meal units:',entry.count,'Edit meal units','number');if(count===null)return;if(!(Number(count)>0)){await themedAlert('Enter meal units greater than zero.');return;}entry.count=Number(count);
 }
 entry.date=date;save();show();
}
async function removeMember(id){if(!await themedConfirm('Remove this member? Existing historical entries are retained.','Remove member'))return;state.members=state.members.filter(m=>m.id!==id);save();show()}
async function removeEntry(type,id){
 let d=data(),entry=d[type].find(x=>x.id===id);if(!entry)return;let message='';
 if(type==='meals'){let member=state.members.find(m=>m.id===entry.memberId);message=`Delete this meal entry?\n\nMember: ${member?.name||'Removed member'}\nDate: ${entry.date}\nMeal units: ${entry.count}\n\nOnly this meal entry will be deleted.`;}
 else if(type==='bazar'){message=`Delete this bazar entry?\n\nBuyer: ${entry.name}\nDate: ${entry.date}\nAmount: ${money(entry.amount)}\nNote: ${entry.note||'Bazar'}\n\nOnly this bazar entry will be deleted.`;}
 else if(type==='deposits'){let member=state.members.find(m=>m.id===entry.memberId);message=`Delete this deposit entry?\n\nMember: ${member?.name||'Removed member'}\nDate: ${entry.date}\nAmount: ${money(entry.amount)}\n\nOnly this deposit entry will be deleted.`;}
 else message='Are you sure you want to delete this entry?';
 if(!await themedConfirm(message,'Delete entry'))return;d[type]=d[type].filter(x=>x.id!==id);save();show();
}
function saveEndpoint(){state.settings.endpoint=$('#endpoint').value.trim();state.settings.token=$('#syncToken').value.trim();save();$('#syncStatus').textContent='Sync settings saved on this phone.'}
function syncNow(mode){let el=$('#syncStatus'),url=state.settings.endpoint;if(!url){el.className='status bad';el.textContent='Enter and save your Apps Script URL first.';return}try{let response,token=state.settings.token;if(!token)throw Error('Enter the access token configured in Apps Script.');if(mode==='push'){response=MealBridge.request('POST',url,JSON.stringify({action:'save',token,data:state}));}else{response=MealBridge.request('GET',url+'?action=load&token='+encodeURIComponent(token),'');}let result=JSON.parse(response);if(result.error||result.ok===false)throw Error(result.error||result.message||'Sync failed');if(mode==='pull'){if(!result.data)throw Error('No saved data returned');state=result.data;save();show();}el=$('#syncStatus');el.className='status good';el.textContent=mode==='push'?'Upload complete. Google Sheets has the latest app data.':'Download complete. Local data has been replaced with the sheet backup.'}catch(e){el=$('#syncStatus');el.className='status bad';el.textContent='Sync failed: '+e.message}}
function exportCSV(){let c=calc(),lines=[['Member','Meals','Net deposit / adjustment (BDT)','Meal cost (BDT)','Remaining balance (BDT)'],...c.rows.map(m=>[m.name,m.meals,m.deposit,m.cost,m.balance])];let csv='\uFEFF'+lines.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');if(window.MealBridge&&MealBridge.exportCSV){MealBridge.exportCSV(csv,'meal-report-'+key()+'.csv')}else{download(csv,'meal-report-'+key()+'.csv','text/csv;charset=utf-8')}}
function exportPDF(){
 let c=calc(),fmt=n=>'BDT '+(Number(n)||0).toLocaleString('en-BD',{minimumFractionDigits:2,maximumFractionDigits:2}),month=key(),generated=today();
 const dateLabel=v=>{let p=String(v||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:String(v||'—')};
 const memberRows=c.rows.map(m=>`<tr><td>${esc(m.name)}</td><td class="num">${m.meals}</td><td class="num">${fmt(m.deposit)}</td><td class="num">${fmt(m.cost)}</td><td class="num ${m.balance<0?'negative':'positive'}">${fmt(m.balance)}</td></tr>`).join('');
 const memberDetails=c.rows.map(m=>{
  let meals=c.d.meals.filter(x=>x.memberId===m.id).slice().sort((a,b)=>a.date.localeCompare(b.date));
  let deposits=c.d.deposits.filter(x=>x.memberId===m.id).slice().sort((a,b)=>a.date.localeCompare(b.date));

  return `<section class="member-block"><h3>${esc(m.name)}</h3><div class="member-kpis"><div>Meal units<strong>${m.meals}</strong></div><div>Deposits / adjustment<strong>${fmt(m.deposit)}</strong></div><div>Meal cost<strong>${fmt(m.cost)}</strong></div><div>Balance<strong class="${m.balance<0?'negative':'positive'}">${fmt(m.balance)}</strong></div></div><div class="detail-grid"><div><h4>Meal entries</h4><table><thead><tr><th>Date</th><th class="num">Units</th></tr></thead><tbody>${mealRows||'<tr><td colspan="2" class="empty">No meal entries</td></tr>'}</tbody></table></div><div><h4>Deposits and adjustments</h4><table><thead><tr><th>Date</th><th class="num">Amount</th></tr></thead><tbody>${depositRows||'<tr><td colspan="2" class="empty">No deposits</td></tr>'}</tbody></table></div></div></section>`
 }).join('');
 const bazarRows=c.d.bazar.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<tr><td>${dateLabel(x.date)}</td><td>${esc(x.buyer||x.name||x.note||'—')}</td><td class="num">${fmt(x.amount)}</td></tr>`).join('');
 let html=`<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meal Manager - ${esc(month)} report</title><style>

function backup(){let json=JSON.stringify(state,null,2);if(window.MealBridge&&MealBridge.exportBackup){MealBridge.exportBackup(json)}else{download(json,'meal-manager-backup.json','application/json')}}
function download(content,name,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([content],{type}));a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function restore(){if(window.MealBridge&&MealBridge.pickBackup){MealBridge.pickBackup();return}let f=$('#restoreFile').files[0];if(!f)return themedAlert('Choose a JSON backup first.');let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.members||!x.months)throw Error('Invalid backup');state=x;save();show();themedAlert('Backup restored.')}catch(e){themedAlert('Could not restore: '+e.message,'Restore failed')}};r.readAsText(f)}
window.restoreFromNative=function(raw){try{let x=JSON.parse(raw);if(!x.members||!x.months)throw Error('Invalid backup');state=x;save();show();themedAlert('Backup restored successfully.')}catch(e){themedAlert('Could not restore: '+e.message,'Restore failed')}}
$('#month').value=monthNow();$('#month').addEventListener('change',show);
const tabOrder=['home','history','members','meals','bazar','reports','sync','about'];
let navigationBusy=false;
function navigateTo(next){
 if(next===tab||navigationBusy)return;
 navigationBusy=true;
 try{
  tab=next;
  show();
  const active=$('#nav button.active');
  if(active)active.scrollIntoView({behavior:'auto',block:'nearest',inline:'center'});
  const fresh=$('#app');
  if(fresh&&fresh.animate){
   fresh.animate(
    [{opacity:.88},{opacity:1}],
    {duration:100,easing:'ease-out'}
   );
  }
 }catch(e){/* Keep navigation usable if animation is unavailable. */}
 finally{navigationBusy=false;}
}
function moveTab(direction){let current=tabOrder.indexOf(tab),next=Math.max(0,Math.min(tabOrder.length-1,current+direction));if(next===current)return;navigateTo(tabOrder[next]);}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-tab]');if(b)navigateTo(b.dataset.tab)});
let swipeStartX=0,swipeStartY=0,swipeStartedInHorizontalScroll=false;
$('#app').addEventListener('touchstart',e=>{
 if(e.touches.length!==1)return;
 let t=e.target;
 if(t.closest('textarea,button,a,[contenteditable="true"]')){swipeStartX=0;swipeStartedInHorizontalScroll=false;return;}
 // Let horizontally scrollable report tables/content consume their own left-right swipes.
 const scrollArea=t.closest('.tablewrap,[data-horizontal-scroll]');
 swipeStartedInHorizontalScroll=!!(scrollArea&&scrollArea.scrollWidth>scrollArea.clientWidth+2);
 swipeStartX=e.touches[0].clientX;swipeStartY=e.touches[0].clientY;
},{passive:true});
$('#app').addEventListener('touchend',e=>{
 if(!swipeStartX||!e.changedTouches.length)return;
 let dx=e.changedTouches[0].clientX-swipeStartX,dy=e.changedTouches[0].clientY-swipeStartY;
 const blocked=swipeStartedInHorizontalScroll;swipeStartX=0;swipeStartY=0;swipeStartedInHorizontalScroll=false;
 if(!blocked&&Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.2)moveTab(dx<0?1:-1);
},{passive:true});
$('#app').addEventListener('touchcancel',()=>{swipeStartX=0;swipeStartY=0;swipeStartedInHorizontalScroll=false;},{passive:true});

// Theme preference is stored separately; meal/account data remains untouched.
(function initTheme(){
 const root=document.documentElement,button=document.getElementById('themeToggle');
 let saved='light';
 try{saved=localStorage.getItem('mealManagerTheme')||'light'}catch(e){}
 function applyTheme(mode){
  const dark=mode==='dark';
  root.dataset.theme=dark?'dark':'light';
  if(button){button.textContent=dark?'☀ Light':'☾ Dark';button.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme');}
  const meta=document.querySelector('meta[name="theme-color"]');
  if(meta)meta.content=dark?'#174a36':'#29966f';
 }
 applyTheme(saved);
 if(button)button.addEventListener('click',()=>{
  const next=root.dataset.theme==='dark'?'light':'dark';
  applyTheme(next);
  try{localStorage.setItem('mealManagerTheme',next)}catch(e){}
 });
})();

show();
</script></body></html>
